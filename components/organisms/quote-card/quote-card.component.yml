$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Quote Card'
group: Card
status: stable
description: 'Stacked card layout with an optional uploaded icon image, a quote description, and an author name. Built with Bootstrap 5 utility classes.'
props:
  type: object
  properties:
    card_border:
      type: boolean
      title: Card border
      description: Add a default border for the card.
      default: false
      examples:
        - false
    background_color:
      type: string
      title: Background color
      description: Brand background color applied to the card.
      default: none
      examples:
        - none
      enum:
        - none
        - bg-body-tertiary
        - bg-tertiary
        - bg-accent
        - bg-primary
        - bg-primary-subtle
        - bg-secondary
        - bg-secondary-subtle
        - bg-dark
      meta:enum:
        none: None
        bg-body-tertiary: Body tertiary
        bg-tertiary: Tertiary
        bg-accent: Accent
        bg-primary: Primary
        bg-primary-subtle: Primary subtle
        bg-secondary: Secondary
        bg-secondary-subtle: Secondary subtle
        bg-dark: Dark
    padded:
      type: boolean
      title: Padded
      description: Adds Bootstrap padding (p-4) to the content area.
      default: false
      examples:
        - false
    box_shadow:
      type: string
      title: Shadow
      description: Bootstrap shadow utility applied to the card.
      default: shadow-none
      examples:
        - shadow-none
      enum:
        - shadow-none
        - shadow-sm
        - shadow
        - shadow-lg
      meta:enum:
        shadow-none: None
        shadow-sm: Small
        shadow: Medium
        shadow-lg: Large
    corner_style:
      type: string
      title: Border radius
      description: Bootstrap rounded utility applied to the card.
      default: rounded-0
      examples:
        - rounded-0
      enum:
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-5
        - rounded-pill
      meta:enum:
        rounded-0: None (square)
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-5: Extra Extra Large
        rounded-pill: Pill
    equal_height:
      type: boolean
      title: Equal height
      description: Apply h-100 to the card wrapper.
      default: false
      examples:
        - false
    stretched_link:
      type: boolean
      title: Stretched link
      description: When enabled and a Card link URL is provided, the entire card becomes clickable using Bootstrap's stretched-link.
      default: false
      examples:
        - false
    link_url:
      type: string
      title: Card link URL
      format: uri-reference
      description: Optional URL for the card link.
      default: ''
    link_target:
      type: string
      title: Link target
      enum:
        - default
        - _self
        - _blank
      default: default
      examples:
        - default
      meta:enum:
        default: Default (same tab)
        _self: Same tab
        _blank: New tab
    icon_image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Icon image
      description: Upload an icon image (SVG, PNG, or WebP). Leave empty to hide the icon area.
      examples:
        - src: /themes/contrib/vartheme_bs5_educare/components/foundation/images/assets/quote-mark.svg
          alt: ''
          width: 40
          height: 40
    icon_alignment:
      type: string
      title: Icon alignment
      description: Horizontal alignment of the icon within the card. Passed straight through to the image component's own alignment utility.
      enum:
        - me-auto
        - mx-auto
        - ms-auto
      default: me-auto
      examples:
        - me-auto
      meta:enum:
        me-auto: Left
        mx-auto: Center
        ms-auto: Right
    description:
      type: string
      title: Description
      description: The quote description text displayed in the card.
      pattern: (.|\r?\n)*
      examples:
        - "The scholarship program made it possible for me to pursue my dream of earning a world-class education."
    author_name:
      type: string
      title: Author name
      description: Name (and optional title) of the person being quoted.
      examples:
        - "John Doe, Master's in Economics"
