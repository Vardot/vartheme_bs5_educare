$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Dated Vertical Card
group: Card
status: stable
description: 'Horizontal card row with a centred stacked day/month date block, a title heading, and a circular action button. The arrow icon sits in a white circle; hovering the card fills the circle with the accent color and rotates the arrow from -45deg (up-right) to 0deg (right). Built with Bootstrap 5 utility classes.'
props:
  type: object
  properties:
    date:
      type: string
      format: date
      title: Date
      description: 'ISO 8601 date string (YYYY-MM-DD). The day and month are extracted and displayed in the date block. Leave empty to hide the date block.'
      default: ''
      examples:
        - '2026-09-05'
    title:
      type: string
      title: Title
      description: 'Card title text rendered as a heading in the centre of the row.'
      default: ''
      examples:
        - 'Lorem Ipsum Dolor Sit Amet'
    heading_level:
      type: string
      title: Heading level
      description: 'HTML heading tag used for the card title.'
      default: h5
      examples:
        - h5
      enum:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
      meta:enum:
        h1: H1
        h2: H2
        h3: H3
        h4: H4
        h5: H5
        h6: H6
    show_action_icon:
      type: boolean
      title: Show action icon
      description: Show or hide the Bootstrap arrow icon on the right side of the card.
      default: true
      examples:
        - true
    card_border:
      type: boolean
      title: Card border
      description: Add a default border for the card.
      default: false
      examples:
        - false
    background_color:
      type: string
      title: Background color
      description: Brand background color applied to the card.
      default: none
      examples:
        - none
      enum:
        - none
        - bg-body-tertiary
        - bg-tertiary
        - bg-accent
        - bg-primary
        - bg-primary-subtle
        - bg-secondary
        - bg-secondary-subtle
        - bg-dark
      meta:enum:
        none: None
        bg-body-tertiary: Body tertiary
        bg-tertiary: Tertiary
        bg-accent: Accent
        bg-primary: Primary
        bg-primary-subtle: Primary subtle
        bg-secondary: Secondary
        bg-secondary-subtle: Secondary subtle
        bg-dark: Dark
    padded:
      type: boolean
      title: Padded
      description: Adds Bootstrap padding (p-4) to the card body.
      default: false
      examples:
        - false
    box_shadow:
      type: string
      title: Shadow
      description: Bootstrap shadow utility applied to the card.
      default: shadow-none
      examples:
        - shadow-none
      enum:
        - shadow-none
        - shadow-sm
        - shadow
        - shadow-lg
      meta:enum:
        shadow-none: None
        shadow-sm: Small
        shadow: Medium
        shadow-lg: Large
    corner_style:
      type: string
      title: Border radius
      description: Bootstrap rounded utility applied to the card.
      default: rounded-0
      examples:
        - rounded-0
      enum:
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-5
        - rounded-pill
      meta:enum:
        rounded-0: None (square)
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-5: Extra Extra Large
        rounded-pill: Pill
    equal_height:
      type: boolean
      title: Equal height
      description: Apply h-100 to the card wrapper.
      default: false
      examples:
        - false
    stretched_link:
      type: boolean
      title: Stretched link
      description: When enabled and a Card link URL is provided, the entire card becomes clickable using Bootstrap's stretched-link.
      default: false
      examples:
        - false
    link_url:
      type: string
      title: Card link URL
      format: uri-reference
      description: Optional URL for the card link.
      default: ''
    link_target:
      type: string
      title: Link target
      enum:
        - default
        - _self
        - _blank
      default: default
      examples:
        - default
      meta:enum:
        default: Default (same tab)
        _self: Same tab
        _blank: New tab
