$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Program Card
group: Card
status: stable
description: 'Horizontal row card showing a program title on the left and up to four metadata columns on the right. An accent line before the title grows from 0 to 1rem wide on row hover/focus. Supports an optional indented (em-dash prefixed) variant for sub-programmes and a bottom-border separator for list layouts.'
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: 'Program title text rendered as a heading on the left side of the row.'
      default: ''
      examples:
        - 'Lorem Ipsum Dolor Sit Amet'
    heading_level:
      type: string
      title: Heading level
      description: 'HTML heading tag used for the program title.'
      default: h5
      examples:
        - h5
      enum:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
      meta:enum:
        h1: H1
        h2: H2
        h3: H3
        h4: H4
        h5: H5
        h6: H6
    indented:
      type: boolean
      title: Indented
      description: 'Shows an em-dash (—) prefix before the title to indicate a sub-programme or nested item.'
      default: false
      examples:
        - false
    col_1:
      type: string
      title: 'Column 1'
      description: 'First metadata column value displayed on the right side of the row.'
      default: ''
      examples:
        - 'A.A'
    col_2:
      type: string
      title: 'Column 2'
      description: 'Second metadata column value.'
      default: ''
      examples:
        - 'A.A'
    col_3:
      type: string
      title: 'Column 3'
      description: 'Third metadata column value.'
      default: ''
      examples:
        - 'A.A'
    col_4:
      type: string
      title: 'Column 4'
      description: 'Fourth metadata column value.'
      default: ''
      examples:
        - 'A.A'
    separator:
      type: boolean
      title: Separator
      description: 'Adds a bottom border to visually separate this row from the one below when stacking multiple instances in a list.'
      default: false
      examples:
        - false
    card_border:
      type: boolean
      title: Card border
      description: 'Add a default Bootstrap border around the full card.'
      default: false
      examples:
        - false
    background_color:
      type: string
      title: Background color
      description: 'Brand background color applied to the card.'
      default: none
      examples:
        - none
      enum:
        - none
        - bg-body-tertiary
        - bg-tertiary
        - bg-accent
        - bg-primary
        - bg-primary-subtle
        - bg-secondary
        - bg-secondary-subtle
        - bg-dark
      meta:enum:
        none: None
        bg-body-tertiary: Body tertiary
        bg-tertiary: Tertiary
        bg-accent: Accent
        bg-primary: Primary
        bg-primary-subtle: Primary subtle
        bg-secondary: Secondary
        bg-secondary-subtle: Secondary subtle
        bg-dark: Dark
    padded:
      type: boolean
      title: Padded
      description: 'Adds p-4 padding to the card body (otherwise p-3).'
      default: false
      examples:
        - false
    box_shadow:
      type: string
      title: Shadow
      description: 'Bootstrap shadow utility applied to the card.'
      default: shadow-none
      examples:
        - shadow-none
      enum:
        - shadow-none
        - shadow-sm
        - shadow
        - shadow-lg
      meta:enum:
        shadow-none: None
        shadow-sm: Small
        shadow: Medium
        shadow-lg: Large
    corner_style:
      type: string
      title: Border radius
      description: 'Bootstrap rounded utility applied to the card.'
      default: rounded-0
      examples:
        - rounded-0
      enum:
        - rounded-0
        - rounded-1
        - rounded-2
        - rounded-3
        - rounded-4
        - rounded-5
        - rounded-pill
      meta:enum:
        rounded-0: None (square)
        rounded-1: Small
        rounded-2: Medium
        rounded-3: Large
        rounded-4: Extra Large
        rounded-5: Extra Extra Large
        rounded-pill: Pill
    equal_height:
      type: boolean
      title: Equal height
      description: 'Apply h-100 to the card wrapper for use in equal-height grid rows.'
      default: false
      examples:
        - false
    stretched_link:
      type: boolean
      title: Stretched link
      description: 'When enabled and a Card link URL is provided, the entire card becomes clickable using Bootstrap''s stretched-link.'
      default: false
      examples:
        - false
    link_url:
      type: string
      title: Card link URL
      format: uri-reference
      description: 'Optional URL for the card link.'
      default: ''
    link_target:
      type: string
      title: Link target
      enum:
        - default
        - _self
        - _blank
      default: default
      examples:
        - default
      meta:enum:
        default: Default (same tab)
        _self: Same tab
        _blank: New tab
