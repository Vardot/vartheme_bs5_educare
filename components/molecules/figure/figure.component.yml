$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Figure
group: Molecules
status: stable
description: Stat figure card with a vertical border accent, large number, optional suffix, and description. Background, font sizes, and text colours are all configurable via Bootstrap utilities. The number counts up from 0 when it scrolls into view.
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
props:
  type: object
  required:
    - number
    - description
  properties:
    number:
      type: string
      title: Number
      description: The main statistic number displayed prominently.
      examples:
        - '0000'
    suffix:
      type: string
      title: Suffix
      description: Optional superscript character shown after the number.
      default: '+'
      examples:
        - '+'
    description:
      type: string
      title: Description
      description: Short descriptive label displayed below the number.
      examples:
        - 'Number description'
    background_color:
      type: string
      title: Background colour
      description: Bootstrap background utility class applied to the card root.
      enum:
        - bg-body
        - bg-body-secondary
        - bg-body-tertiary
        - bg-primary
        - bg-primary-subtle
        - bg-secondary
        - bg-secondary-subtle
        - bg-success
        - bg-success-subtle
        - bg-danger
        - bg-danger-subtle
        - bg-warning
        - bg-warning-subtle
        - bg-info
        - bg-info-subtle
        - bg-light
        - bg-dark
        - bg-dark-subtle
        - bg-black
        - bg-white
        - bg-transparent
      default: bg-primary
      examples:
        - bg-dark
      meta:enum:
        bg-body: Body
        bg-body-secondary: Body secondary
        bg-body-tertiary: Body tertiary
        bg-primary: Primary
        bg-primary-subtle: Primary subtle
        bg-secondary: Secondary
        bg-secondary-subtle: Secondary subtle
        bg-success: Success
        bg-success-subtle: Success subtle
        bg-danger: Danger
        bg-danger-subtle: Danger subtle
        bg-warning: Warning
        bg-warning-subtle: Warning subtle
        bg-info: Info
        bg-info-subtle: Info subtle
        bg-light: Light
        bg-dark: Dark
        bg-dark-subtle: Dark subtle
        bg-black: Black
        bg-white: White
        bg-transparent: Transparent
    number_size:
      type: string
      title: Number size
      description: Bootstrap display-* utility controlling the number font size.
      enum:
        - display-1
        - display-2
        - display-3
        - display-4
        - display-5
        - display-6
      default: display-1
      examples:
        - display-1
      meta:enum:
        display-1: Display 1 (largest)
        display-2: Display 2
        display-3: Display 3
        display-4: Display 4
        display-5: Display 5
        display-6: Display 6 (smallest)
    number_color:
      type: string
      title: Number colour
      description: Bootstrap text colour utility applied to the number.
      enum:
        - text-body
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-light
        - text-dark
        - text-muted
        - text-white
        - text-white-50
        - text-black
        - text-black-50
      default: text-white
      examples:
        - text-white
      meta:enum:
        text-body: Body
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-light: Light
        text-dark: Dark
        text-muted: Muted
        text-white: White
        text-white-50: White 50%
        text-black: Black
        text-black-50: Black 50%
    suffix_color:
      type: string
      title: Suffix colour
      description: Bootstrap text colour utility applied to the superscript suffix.
      enum:
        - text-body
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-light
        - text-dark
        - text-muted
        - text-white
        - text-white-50
        - text-black
        - text-black-50
      default: text-white-50
      examples:
        - text-white-50
      meta:enum:
        text-body: Body
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-light: Light
        text-dark: Dark
        text-muted: Muted
        text-white: White
        text-white-50: White 50%
        text-black: Black
        text-black-50: Black 50%
    description_size:
      type: string
      title: Description size
      description: Bootstrap fs-* utility controlling the description font size.
      enum:
        - fs-1
        - fs-2
        - fs-3
        - fs-4
        - fs-5
        - fs-6
      default: fs-6
      examples:
        - fs-6
      meta:enum:
        fs-1: FS 1 (largest)
        fs-2: FS 2
        fs-3: FS 3
        fs-4: FS 4
        fs-5: FS 5
        fs-6: FS 6 (smallest)
    description_color:
      type: string
      title: Description colour
      description: Bootstrap text colour utility applied to the description label.
      enum:
        - text-body
        - text-primary
        - text-secondary
        - text-success
        - text-danger
        - text-warning
        - text-info
        - text-light
        - text-dark
        - text-muted
        - text-white
        - text-white-50
        - text-black
        - text-black-50
      default: text-white-50
      examples:
        - text-white-50
      meta:enum:
        text-body: Body
        text-primary: Primary
        text-secondary: Secondary
        text-success: Success
        text-danger: Danger
        text-warning: Warning
        text-info: Info
        text-light: Light
        text-dark: Dark
        text-muted: Muted
        text-white: White
        text-white-50: White 50%
        text-black: Black
        text-black-50: Black 50%
